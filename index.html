<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boleto de Fiesta</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#7626ff,#251044 35%,#080711 75%);font-family:Arial;color:#fff}.card{width:min(92vw,560px);padding:40px 24px;text-align:center;border:1px solid #ffffff33;border-radius:30px;background:#0c0b18ed;box-shadow:0 25px 80px #0008}.tag{letter-spacing:4px;color:#ffcf4a;font-weight:800}.num{font-size:clamp(110px,35vw,210px);line-height:1;font-weight:900;margin:12px 0;color:#ffcf4a}.status{font-size:clamp(27px,7vw,40px);font-weight:900;margin:12px 0}.valid{color:#4ade80}.used{color:#fb7185}.loading{color:#facc15}.detail{color:#ddd;line-height:1.5}.admin{display:inline-block;margin-top:20px;color:#aaa;font-size:13px}</style></head><body><main class="card"><div class="tag">PASE DE ENTRADA</div><div id="n" class="num">--</div><div id="status" class="status loading">VERIFICANDO...</div><div id="detail" class="detail">Consultando el estado del boleto</div><a id="admin" class="admin" href="admin/">Control de acceso</a></main><script type="module" src="ticket.js"></script></body></html>
