<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boleto de Fiesta</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#7626ff 0,#251044 33%,#080711 72%);font-family:Arial,sans-serif;color:white;overflow:hidden}.card{width:min(92vw,560px);padding:42px 24px;text-align:center;border:1px solid #ffffff33;border-radius:30px;background:#0c0b18dd;box-shadow:0 25px 80px #0008,0 0 45px #b34cff44}.eyebrow{font-size:18px;letter-spacing:4px;color:#ffcf4a;font-weight:700}.num{font-size:clamp(110px,35vw,220px);line-height:.95;font-weight:900;margin:18px 0;background:linear-gradient(135deg,#fff,#ffcf4a,#ff55d6);-webkit-background-clip:text;color:transparent}.msg{font-size:clamp(28px,7vw,42px);font-weight:800;margin:12px 0}.sub{font-size:17px;color:#d9d6e8;margin-top:18px}.dot{position:fixed;width:9px;height:9px;border-radius:2px;background:#ffcf4a;animation:f 6s linear infinite;top:-20px}.dot:nth-child(2n){background:#ff55d6}.dot:nth-child(3n){background:#38d9ff}@keyframes f{to{transform:translateY(110vh) rotate(720deg)}}</style></head><body><div class="dot" style="left:8%;animation-delay:-1s"></div><div class="dot" style="left:23%;animation-delay:-4s"></div><div class="dot" style="left:41%;animation-delay:-2s"></div><div class="dot" style="left:62%;animation-delay:-5s"></div><div class="dot" style="left:79%;animation-delay:-3s"></div><div class="dot" style="left:92%;animation-delay:-.5s"></div><main class="card"><div class="eyebrow">PASE DE ENTRADA</div><div id="number" class="num">--</div><div class="msg">¡Disfruta de la fiesta! 🎉</div><div class="sub">Presenta esta pantalla en la entrada</div></main><script>const p=new URLSearchParams(location.search),n=parseInt(p.get('b'),10),el=document.getElementById('number');if(n>=1&&n<=70){el.textContent=String(n).padStart(2,'0');document.title='Boleto '+String(n).padStart(2,'0')}else{el.textContent='--';document.querySelector('.msg').textContent='Boleto no válido';}</script></body></html>
