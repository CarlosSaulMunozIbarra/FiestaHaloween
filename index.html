<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boleto de Fiesta</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#7626ff,#251044 35%,#080711 75%);font-family:Arial;color:#fff}.card{width:min(92vw,560px);padding:42px 24px;text-align:center;border:1px solid #ffffff33;border-radius:30px;background:#0c0b18e8;box-shadow:0 25px 80px #0008,0 0 45px #b34cff44}.tag{letter-spacing:4px;color:#ffcf4a;font-weight:800}.num{font-size:clamp(110px,35vw,220px);line-height:1;font-weight:900;margin:18px 0;background:linear-gradient(135deg,#fff,#ffcf4a,#ff55d6);-webkit-background-clip:text;color:transparent}.msg{font-size:clamp(28px,7vw,42px);font-weight:800}.sub{color:#d9d6e8}.admin{display:inline-block;margin-top:24px;color:#aaa;font-size:12px}</style></head><body><main class="card"><div class="tag">PASE DE ENTRADA</div><div id="n" class="num">--</div><div id="m" class="msg">¡Disfruta de la fiesta! 🎉</div><p class="sub">Presenta esta pantalla en la entrada</p><a id="admin" class="admin" href="admin/">Control de acceso</a></main><script>const p=new URLSearchParams(location.search),v=Number(p.get('b'));if(v>=1&&v<=70){const n=String(v).padStart(2,'0');document.querySelector('#n').textContent=n;document.title='Boleto '+n;document.querySelector('#admin').href='admin/?b='+n}else{document.querySelector('#m').textContent='Boleto no válido'}</script></body></html>
