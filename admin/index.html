<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de acceso</title><style>body{background:#080711;color:#fff;font-family:Arial;margin:0}.w{max-width:900px;margin:auto;padding:20px}.p{background:#18152d;padding:20px;border-radius:18px;margin:15px 0}input,button{padding:12px;margin:4px;border:0;border-radius:8px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}.t{padding:14px;text-align:center;border-radius:9px;font-weight:bold;cursor:pointer}.f{background:#14532d}.u{background:#7f1d1d}.hide{display:none}button{font-weight:800;cursor:pointer}</style><div class=w><h1>🎃 Control de acceso</h1><div id=login class=p><input id=e type=email placeholder=Correo><input id=p type=password placeholder=Contraseña><button id=in>Entrar</button><div id=err></div></div><div id=app class=hide><div class=p><h2 id=stats></h2><button id=out>Cerrar sesión</button></div><div id=sel class="p hide"><h2>Boleto <span id=num></span></h2><h3 id=state></h3><button id=use>MARCAR COMO UTILIZADO</button></div><div class=p><h2>Checklist</h2><div id=grid class=g></div></div></div></div><script type=module src=app.js></script></html>
