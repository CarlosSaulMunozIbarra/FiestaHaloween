<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de acceso</title><style>*{box-sizing:border-box}body{margin:0;background:#080711;color:#fff;font-family:Arial}.wrap{max-width:900px;margin:auto;padding:20px}.panel{background:#151326;border:1px solid #ffffff22;border-radius:18px;padding:20px;margin-bottom:18px}input,button{font:inherit;padding:13px;border-radius:10px;border:0;margin:5px}input{background:#fff;color:#111}button{cursor:pointer;font-weight:800;background:#ff9f1c}.danger{background:#ef4444;color:#fff}.ok{background:#22c55e}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}.ticket{padding:15px 8px;border-radius:12px;text-align:center;font-weight:900}.free{background:#14532d}.used{background:#7f1d1d}.big{font-size:48px}.hide{display:none}.muted{color:#bbb}.stats{font-size:22px;font-weight:800}</style></head><body><div class="wrap"><h1>🎃 Control de acceso</h1><section id="login" class="panel"><h2>Acceso del administrador</h2><input id="email" type="email" placeholder="Correo"><input id="pass" type="password" placeholder="Contraseña"><button id="go">Entrar</button><p id="err"></p></section><div id="app" class="hide"><section class="panel"><div class="stats" id="stats">Cargando...</div><button id="logout">Cerrar sesión</button></section><section id="scan" class="panel hide"><div class="muted">Boleto escaneado</div><div id="selected" class="big"></div><div id="selectedState"></div><button id="use" class="ok">MARCAR COMO UTILIZADO</button></section><section class="panel"><h2>Checklist</h2><div id="grid" class="grid"></div></section></div></div><script type="module" src="app.js"></script></body></html>
