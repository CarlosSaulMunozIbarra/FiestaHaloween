<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de acceso</title><style>*{box-sizing:border-box}body{background:#080711;color:#fff;font-family:Arial;margin:0}.w{max-width:920px;margin:auto;padding:18px}.p{background:#18152d;padding:20px;border-radius:18px;margin:14px 0}input,button{padding:13px;margin:5px;border:0;border-radius:9px;font-size:16px}button{font-weight:800;cursor:pointer}.primary{background:#22c55e}.reactivate{background:#f59e0b}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}.t{padding:14px 6px;text-align:center;border-radius:9px;font-weight:bold;cursor:pointer}.f{background:#14532d}.u{background:#7f1d1d}.hide{display:none}.num{font-size:70px;font-weight:900;color:#ffcf4a}.valid{color:#4ade80}.used{color:#fb7185}</style></head><body><div class=w><h1>🎃 Control de acceso</h1><section id=login class=p><h2>Acceso exclusivo del administrador</h2><input id=e type=email placeholder=Correo><input id=p type=password placeholder=Contraseña><button id=in>Entrar</button><div id=err></div></section><div id=app class=hide><section class=p><h2 id=stats></h2><button id=out>Cerrar sesión</button></section><section id=sel class="p hide"><div>Boleto escaneado</div><div id=num class=num></div><h2 id=state></h2><div id=when></div><button id=use class=primary>MARCAR COMO UTILIZADO</button><button id=reactivate class="reactivate hide">REACTIVAR BOLETO</button></section><section class=p><h2>Checklist</h2><div id=grid class=g></div></section></div></div><script type=module src=app.js></script></body></html>
